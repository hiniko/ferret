name: release
run-name: release ${{ inputs.tag }}

# Manual publish to NuGet. Tag the commit first (e.g. `git tag 0.1.1 && git push origin 0.1.1`),
# then run this workflow from the Actions tab and enter that tag. The package version is derived
# from the tag by MinVer (unprefixed, e.g. tag `0.1.1` -> version 0.1.1), so the tag is the source
# of truth. Publishing is never automatic. Auth to nuget.org is OIDC trusted publishing
# (no long-lived API key); packages carry build provenance attestations.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. 0.1.1)'
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read          # read ci-ok check-run on the tag commit / PR head
      pull-requests: read   # find the merged PR for the tag commit
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version tag (expected e.g. 0.1.1 or 0.1.1-rc.1)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0          # MinVer needs full history + tags to derive the version
          persist-credentials: false

      - name: Require green CI on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          # Only count check runs created by GitHub Actions, so a fork PR cannot spoof `ci-ok`.
          ci_ok() {
            gh api "repos/${REPO}/commits/$1/check-runs?check_name=ci-ok&per_page=100" \
              --jq '[.check_runs[] | select(.conclusion == "success" and .app.slug == "github-actions")] | length'
          }
          if [ "$(ci_ok "$sha")" -ge 1 ]; then exit 0; fi
          # Bot-merged (GITHUB_TOKEN) squash commits get no push CI: accept ci-ok on the merged PR's head instead.
          for head in $(gh api "repos/${REPO}/commits/${sha}/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main") | .head.sha'); do
            if [ "$(ci_ok "$head")" -ge 1 ]; then exit 0; fi
          done
          echo "::error::No successful 'ci-ok' on ${sha} or its merged PR head (tag ${TAG}). Merge via PR / wait for CI first."
          exit 1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore Ferret.slnx --locked-mode
      - run: dotnet build Ferret.slnx -c Release --no-restore
      - run: dotnet test Ferret.slnx -c Release --no-build
      - run: dotnet pack Ferret.slnx -c Release --no-build -o ./artifacts

      # Fail loudly if the tag did not produce the expected version (MinVer fell back to a height-based pre-release).
      - name: Verify packed version matches the tag
        run: |
          if ! ls "./artifacts/Ferret.Core.${TAG}.nupkg" >/dev/null 2>&1; then
            echo "::error::No Ferret.Core.${TAG}.nupkg - packed version does not match tag '${TAG}'. Is the tag on this commit?"
            ls -1 ./artifacts
            exit 1
          fi

      # The GitHub release doubles as the changelog. --generate-notes only lists merged
      # PRs, and this repo commits straight to main — so build the notes from the commit
      # log between the previous tag and this one, grouped by conventional-commit type.
      - name: Build release notes
        env:
          TAG: ${{ inputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          range=${prev:+$prev..}${TAG}
          repo_url="${SERVER_URL}/${REPO}"

          # Types that are pure repo plumbing (ci, chore, build, test, style) are collected
          # but never rendered — a consumer reading the release does not care about them.
          log=$(git log --no-merges --reverse --format='%H%x09%s' "$range")

          # Note: every conditional below ends in `|| true`. GitHub runs `run:` under `bash -e`,
          # where a bare `[ .. ] && ..` that evaluates false becomes a nonzero step exit.
          section() {  # $1 = heading, $2 = alternation of conventional-commit types
            body=$(printf '%s\n' "$log" |
              awk -F'\t' -v types="$2" -v url="$repo_url" '
                { re = "^(" types ")(\\(.+\\))?!?: " }
                $2 ~ re { sub(re, "", $2); printf "- %s ([%s](%s/commit/%s))\n", $2, substr($1,1,7), url, $1 }')
            [ -n "$body" ] && printf '### %s\n\n%s\n\n' "$1" "$body" >> notes.md || true
          }

          section 'Features'      'feat'
          section 'Fixes'         'fix'
          section 'Performance'   'perf'
          section 'Refactoring'   'refactor'
          section 'Documentation' 'docs'

          # Non-conventional subjects still belong in the notes; the plumbing types do not.
          other=$(printf '%s\n' "$log" |
            awk -F'\t' -v url="$repo_url" '
              $2 !~ /^(feat|fix|perf|refactor|docs|build|chore|ci|test|style)(\(.+\))?!?: / {
                printf "- %s ([%s](%s/commit/%s))\n", $2, substr($1,1,7), url, $1 }')
          [ -n "$other" ] && printf '### Other\n\n%s\n\n' "$other" >> notes.md || true

          [ -s notes.md ] || echo "_No user-facing changes._" >> notes.md
          [ -n "$prev" ] && printf '**Full Changelog**: %s/compare/%s...%s\n' "$repo_url" "$prev" "$TAG" >> notes.md || true

          echo "--- release notes ---"
          cat notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            notes.md
          if-no-files-found: error

  # No checkout, no project code: only this job holds id-token/attestations.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.nupkg

  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # gh release create
      id-token: write       # NuGet trusted publishing (OIDC)
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      # Short-lived key (1h): request it right before pushing.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Attach the exact attested bytes (nuget.org repo-signs its copies, so they differ).
        run: gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg --repo "$REPO" --verify-tag --notes-file notes.md --title "$TAG"
