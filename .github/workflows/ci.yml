name: ci

# No paths-ignore: `ci-ok` is a required check, so it must report on every PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15-alpine", "16-alpine", "17-alpine"]
    env:
      FERRET_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - run: dotnet restore Ferret.slnx
      - run: dotnet build Ferret.slnx -c Release --no-restore
      - run: dotnet test Ferret.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-pg${{ matrix.postgres }}
          path: '**/test-results.trx'

  # The single required status check for the main ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix success
        env:
          RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::build-and-test result: $RESULT"
            exit 1
          fi
