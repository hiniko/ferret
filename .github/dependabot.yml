version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # v8+ moved to a commercial licence.
      - dependency-name: FluentAssertions
        versions: [">= 8.0.0"]
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0.0; lift when it allows 3.x.
      - dependency-name: Microsoft.OpenApi
        versions: [">= 3.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    # semver-*-days is not supported for github-actions, so default-days covers every bump.
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
